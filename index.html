<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Task Manager</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>


  <!-- Firebase Core (required) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
  apiKey: "AIzaSyCuPj8oxeObWjm7ykDLL1-a9xuJ9yim9xI",
  authDomain: "setasks-dc876.firebaseapp.com",
  projectId: "setasks-dc876",
  storageBucket: "setasks-dc876.firebasestorage.app",
  messagingSenderId: "324371355585",
  appId: "1:324371355585:web:072971abe7cf2e788ec140",
  measurementId: "G-8LX3BVLN9D"
};

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
  </script>
</head>
<body>
  <div id="authSection">
    <div id="loginForm">
      <h2>Login</h2>
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <button id="loginBtn">Login</button>
      <p>Don't have an account? <a href="#" id="showSignup">Sign up</a></p>
    </div>

    <div id="signupForm" style="display: none;">
      <h2>Sign Up</h2>
      <input type="email" id="signupEmail" placeholder="Email" required />
      <input type="password" id="signupPassword" placeholder="Password" required />
      <button id="signupBtn">Sign Up</button>
      <p>Already have an account? <a href="#" id="showLogin">Login</a></p>
    </div>

    <div id="userSection" style="display: none;">
      <span id="userEmail"></span>
      <button id="logoutBtn">Logout</button>
    </div>

    <div id="superAdminDashboard" style="display:none;">
      <h2>Super Admin Dashboard</h2>
      <!-- Create Company -->
      <h3>Create New Company</h3>
      <input type="text" id="companyName" placeholder="Company Name" />
      <button id="createCompanyBtn">Create Company</button>
      <!-- Create Admin -->
      <h3>Create Admin Account</h3>
      <input type="text" id="adminFullName" placeholder="Full Name" />
      <input type="email" id="adminEmail" placeholder="Admin Email" />
      <input type="password" id="adminPassword" placeholder="Password" />
      <select id="adminCompanySelect"></select>
      <button id="createAdminBtn">Create Admin</button>
    </div>

    <!-- Admin Dashboard -->
    <div id="adminDashboard" style="display:none;">
      <h2>Admin Dashboard</h2>

      <!-- Create User -->
      <h3>Create New User</h3>
      <input type="text" id="userFullName" placeholder="Full Name" />
      <input type="email" id="userEmail" placeholder="User Email" />
      <input type="password" id="userPassword" placeholder="Password" />
      <button id="createUserBtn">Create User</button>

      <!-- Create Task -->
      <h3>Create Task</h3>
      <input type="text" id="taskTitle" placeholder="Task Title" />
      <textarea id="taskDescription" placeholder="Task Description"></textarea>
      <label>Assign To:</label>
      <select id="userSelect" multiple size="5" style="width:100%;"></select>
      <button id="createTaskBtn">Create Task</button>

      <!-- View Tasks -->
      <h3>All Tasks</h3>
      <div id="taskList"></div>
    </div>

    <div id="userDashboard" style="display:none;">
      <h2>User Dashboard</h2>
      <div id="userTasks"></div>
    </div>
  </div>
  <div class="container">
    <header>
      <h1>Task Manager</h1>
      <button id="addTaskBtn" class="btn add-btn">
        <i class="fas fa-plus"></i> Add Task
      </button>
    </header>

    <div class="task-filters">
      <button class="filter-btn active" data-filter="all">All Tasks</button>
      <button class="filter-btn" data-filter="today">Today</button>
      <button class="filter-btn" data-filter="tomorrow">Tomorrow</button>
      <button class="filter-btn" data-filter="upcoming">Upcoming</button>
      <button class="filter-btn" data-filter="past">Past</button>
    </div>

    <div id="taskModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h2 id="modalTitle">Add New Task</h2>
        <form id="taskForm">
          <input type="hidden" id="taskId">
          <div class="form-group">
            <label for="taskTitle">Title*</label>
            <input type="text" id="taskTitle" required />
          </div>
          
          <div class="form-group">
            <label for="taskDays">No. of days required*</label>
            <input type="number" id="taskDays" min="1" value="1" required />
          </div>
          
          <div class="form-group">
            <label for="taskDate">Start Date*</label>
            <input type="date" id="taskDate" required />
          </div>
          
          <div class="form-group">
            <label for="taskEndDate">End Date (optional)</label>
            <input type="date" id="taskEndDate" />
          </div>
          
          <div class="form-group">
            <label for="taskStartTime">Start Time</label>
            <input type="time" id="taskStartTime" />
          </div>
          
          <div class="form-group">
            <label for="taskEndTime">End Time (optional)</label>
            <input type="time" id="taskEndTime" />
          </div>
          
          <div class="form-group">
            <label for="taskLocation">Location</label>
            <input type="text" id="taskLocation" />
          </div>
          
          <div class="form-group">
            <label for="taskStaff">No. of Staff Required</label>
            <input type="number" id="taskStaff" min="1" value="1" />
          </div>
          
          <div class="form-group">
            <label for="taskDescription">Job Description</label>
            <textarea id="taskDescription" rows="4"></textarea>
          </div>
          
          <div class="form-group">
            <label for="taskStatus">Status*</label>
            <select id="taskStatus" required>
              <option value="Pending">Pending</option>
              <option value="Completed">Completed</option>
              <option value="Cancelled">Cancelled</option>
            </select>
          </div>
          
          <button type="submit" class="btn save-btn">Save Task</button>
        </form>
      </div>
    </div>

    <div id="tasksContainer">
      <!-- Tasks will be loaded here -->
    </div>

    <div class="user-info" style="display:none;" id="userInfo">
      Welcome, <span id="userName"></span> (<span id="userRole"></span>)
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
